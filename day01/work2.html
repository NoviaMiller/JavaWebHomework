<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐表格</title>
    <style>
        table {
            /* 解释一下下面每个元素的作用 */
            /* 表格边框合并? 合并表格边框可以使表格看起来更整齐 */
            border-collapse: collapse;
            /* 表格宽度? 100% 表示表格宽度占满父元素宽度 */
            width: 100%;
            /* 表格最大宽度 */
            max-width: 1200px;
            /* 表格外边距 */
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            padding-left: 10px;
            padding-right: 10px;
            text-align: center;
            color: #000;
        }
        th {
            font-weight: bold;
            background-color: #f5f5f5;
        }
        a {
            color: #000;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        th:nth-child(5), td:nth-child(5) {
            width: 30%;
            /* 播放按钮宽度 30% 表示播放按钮宽度占表格宽度的 30% */
        }
        audio {
            /* 播放按钮宽度 100% 表示播放按钮宽度占表格宽度的 100% */
            width: 100%;
            height: 40px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>编号</th>
                <th>标题</th>
                <th>歌手</th>
                <th>时长</th>
                <th>播放</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>唐人</td>
                <td><a href="https://baike.baidu.com/item/%E8%A6%83%E6%B2%90%E6%9B%A6/2582347?fr=aladdin" target="_blank">覃沐曦</a></td>
                <!-- target="_blank" 表示在新窗口打开链接 -->
                <td>03:44</td>
                <td>
                    <audio controls>
                        <source src="./mp3/唐人.mp3" type="audio/mpeg">
                        您的浏览器不支持音频播放。
                    </audio>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>漂洋过海来看你</td>
                <td><a href="https://baike.baidu.com/item/%E5%91%A8%E6%B7%B1/15089196?fr=aladdin" target="_blank">周深</a></td>
                <td>03:03</td>
                <td>
                    <audio controls>
                        <source src="./mp3/漂洋过海来看你.mp3" type="audio/mpeg">
                        您的浏览器不支持音频播放。
                    </audio>
                </td>
            </tr>
            <tr>
                <td>3</td>
                <td>小幸运</td>
                <td><a href="https://baike.baidu.com/item/%E7%94%B0%E9%A6%A5%E7%94%84?fromModule=lemma_search-box" target="_blank">田馥甄</a></td>
                <td>04:17</td>
                <td>
                    <audio controls>
                        <source src="./mp3/小幸运.mp3" type="audio/mpeg">
                        您的浏览器不支持音频播放。
                    </audio>
                </td>
            </tr>
            <tr>
                <td>4</td>
                <td>Excitant</td>
                <td><a href="https://baike.baidu.com/item/%E6%88%90%E9%A9%B0%E6%B4%8B?fromModule=lemma_search-box" target="_blank">成驰洋</a></td>
                <td>03:30</td>
                <td>
                    <audio controls>
                        <source src="./mp3/Excitant.mp3" type="audio/mpeg">
                        您的浏览器不支持音频播放。
                    </audio>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
